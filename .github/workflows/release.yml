name: Build & Release

# Pushing a tag like v4.2.4 builds every platform and publishes a GitHub
# Release with the four downloads attached. Pushes and pull requests that
# touch the app or this file only build (and smoke-test) as a check; their
# downloads are kept as workflow artifacts for a few days.
#
# Free for a public repository: standard GitHub-hosted runners have no
# minute limit there, and release assets are not billed.

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "PyP6-Roland-P6-Sample-Manager_*.py"
      - "pyp6logo.ico"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "PyP6-Roland-P6-Sample-Manager_*.py"
      - "pyp6logo.ico"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            python: "3.14"
          - os: ubuntu-22.04        # oldest supported glibc = widest reach
            platform: linux-x64
            python: "3.14"
          # 3.13 on macOS: README 1.2 - Tcl/Tk 9 breaks drag & drop and parts
          # of the Synth window, and the macOS builds are where 9 shows up.
          - os: macos-latest
            platform: macos-arm64
            python: "3.13"
          - os: macos-15-intel
            platform: macos-x64
            python: "3.13"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Find the app script and its version
        id: meta
        run: |
          script=$(ls PyP6-Roland-P6-Sample-Manager_*.py | head -n 1)
          version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' "$script")
          echo "script=$script" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "$tag" != "$version" ]]; then
              echo "::error::Tag v$tag does not match APP_VERSION $version in $script"
              exit 1
            fi
            echo "label=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "label=v$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          echo "Building $script, version $version"

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk8.6 libportaudio2 xvfb

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy soundfile sounddevice pydub tkinterdnd2 audioop-lts pillow

      - name: Check Tcl/Tk version
        run: |
          tk=$(python -c "import tkinter; print(tkinter.Tcl().eval('info patchlevel'))")
          echo "Tcl/Tk $tk"
          if [[ "$tk" == 9.* ]]; then
            echo "::warning::Built against Tcl/Tk $tk - drag & drop will not work in this build (README 1.2)."
          fi

      # Windows and Linux use the "shared" builds: ffmpeg and ffprobe then
      # share one copy of the codec libraries instead of each carrying its
      # own - the static builds made the download about half again as big.
      # Everything is flattened into ffbin/, the same flat layout the files
      # get inside the bundle, and run from there as a check.
      - name: Fetch ffmpeg and ffprobe
        run: |
          mkdir -p ffbin ffdl
          case "${{ matrix.platform }}" in
            windows-x64)
              curl -fsSL -o ffdl/ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
              7z x -offdl ffdl/ff.zip > /dev/null
              cp ffdl/*/bin/ffmpeg.exe ffdl/*/bin/ffprobe.exe ffdl/*/bin/*.dll ffbin/ ;;
            linux-x64)
              curl -fsSL -o ffdl/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl-shared.tar.xz
              tar -xJf ffdl/ff.tar.xz -C ffdl
              cp ffdl/*/bin/ffmpeg ffdl/*/bin/ffprobe ffbin/
              # -L: the sonames are symlinks; the bundle needs real files
              # under the names the binaries ask for.
              for lib in ffdl/*/lib/*.so.*; do
                cp -L "$lib" ffbin/
              done
              # Mirrors the frozen app, where the libraries sit next to the
              # binaries and PyInstaller's bootloader puts that folder on
              # LD_LIBRARY_PATH for child processes.
              export LD_LIBRARY_PATH="$PWD/ffbin" ;;
            macos-arm64|macos-x64)
              arch=$([[ "${{ matrix.platform }}" == macos-arm64 ]] && echo arm64 || echo amd64)
              for tool in ffmpeg ffprobe; do
                curl -fsSL -o "ffdl/$tool.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/$tool.zip"
                unzip -o -q "ffdl/$tool.zip" -d ffbin
              done ;;
          esac
          chmod +x ffbin/* || true
          ls -la ffbin
          du -sh ffbin
          ./ffbin/ffmpeg -hide_banner -version | head -n 1
          ./ffbin/ffprobe -hide_banner -version | head -n 1

      - name: Build with PyInstaller
        run: |
          case "${{ matrix.platform }}" in
            windows-x64)
              ff=(--add-binary "ffbin/ffmpeg.exe;."
                  --add-binary "ffbin/ffprobe.exe;."
                  --add-binary "ffbin/*.dll;.")
              mode=(--onefile) ;;
            linux-x64)
              ff=(--add-binary "ffbin/ffmpeg:."
                  --add-binary "ffbin/ffprobe:."
                  --add-binary "ffbin/*.so.*:.")
              mode=(--onefile) ;;
            macos-*)
              ff=(--add-binary "ffbin/ffmpeg:."
                  --add-binary "ffbin/ffprobe:.")
              # A .app has to be a folder bundle; one-file .apps are
              # deprecated in PyInstaller and start slowly.
              mode=(--onedir --osx-bundle-identifier io.github.pyp6.samplemanager) ;;
          esac

          # First a throwaway probe frozen with the same ffmpeg files: it
          # runs ffmpeg and ffprobe from inside a real bundle, which is the
          # only place a missing shared library would show up.
          cat > ffcheck.py <<'EOF'
          import os, subprocess, sys
          for tool in ("ffmpeg", "ffprobe"):
              exe = os.path.join(sys._MEIPASS, tool + (".exe" if os.name == "nt" else ""))
              out = subprocess.run([exe, "-hide_banner", "-version"],
                                   capture_output=True, text=True, check=True)
              print(out.stdout.splitlines()[0])
          EOF
          python -m PyInstaller --onefile --name ffcheck -y --distpath ffcheck-dist \
            --workpath ffcheck-build "${ff[@]}" ffcheck.py > ffcheck-build.log 2>&1 \
            || { cat ffcheck-build.log; exit 1; }
          ./ffcheck-dist/ffcheck

          python -m PyInstaller --name PyP6 -y --clean --windowed \
            --icon pyp6logo.ico --collect-data tkinterdnd2 \
            "${mode[@]}" "${ff[@]}" "${{ steps.meta.outputs.script }}"
          ls -la dist

      - name: Smoke test (the app must still be running after 30 s)
        run: |
          case "${{ matrix.platform }}" in
            windows-x64) exe=dist/PyP6.exe ;;
            linux-x64)   exe=dist/PyP6 ;;
            macos-*)     exe=dist/PyP6.app/Contents/MacOS/PyP6 ;;
          esac
          if [[ "${{ matrix.platform }}" == linux-x64 ]]; then
            xvfb-run -a "$exe" > smoke.log 2>&1 &
          else
            "$exe" > smoke.log 2>&1 &
          fi
          pid=$!
          sleep 30
          if kill -0 "$pid" 2>/dev/null; then
            echo "Still running after 30 s - OK"
            kill "$pid" 2>/dev/null || true
            [[ "$RUNNER_OS" == Windows ]] && taskkill //F //IM PyP6.exe > /dev/null 2>&1 || true
            [[ "$RUNNER_OS" == Linux ]] && pkill -f dist/PyP6 || true
          else
            echo "::error::The app exited during startup"
            cat smoke.log
            exit 1
          fi

      - name: Package
        id: pkg
        run: |
          name="PyP6-${{ steps.meta.outputs.label }}-${{ matrix.platform }}"
          mkdir -p "stage/$name" out
          cp README.md "stage/$name/"
          case "${{ matrix.platform }}" in
            windows-x64)
              cp dist/PyP6.exe "stage/$name/"
              (cd stage && 7z a -tzip -mx=9 "../out/$name.zip" "$name" > /dev/null) ;;
            linux-x64)
              cp dist/PyP6 "stage/$name/"
              chmod +x "stage/$name/PyP6"
              tar -czf "out/$name.tar.gz" -C stage "$name" ;;
            macos-*)
              cp -R dist/PyP6.app "stage/$name/"
              # ditto keeps the bundle's symlinks and signatures intact,
              # which a plain zip does not.
              ditto -c -k --keepParent "stage/$name" "out/$name.zip" ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/*
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PyP6 $GITHUB_REF_NAME" \
            --generate-notes
