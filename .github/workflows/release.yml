name: Build & Release

# Pushing a tag like v4.2.4 builds every platform and publishes a GitHub
# Release with the four downloads attached. The tag is the only place the
# version is written: the build stamps it into the app, and an annotated
# tag's message becomes the release notes. The same can be started from
# the Actions tab without git: "Run workflow" with a tag name - the tag is
# then created on the commit that was built. Pushes and pull requests that
# touch the app or this file only build (and smoke-test) as a check; their
# downloads are kept as workflow artifacts for a few days.
#
# Free for a public repository: standard GitHub-hosted runners have no
# minute limit there, and release assets are not billed.

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "PyP6-Roland-P6-Sample-Manager.py"
      - "pyp6logo.ico"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "PyP6-Roland-P6-Sample-Manager.py"
      - "pyp6logo.ico"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v4.2.4 (v4.2.4-rc1 = pre-release). Empty = build only."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

env:
  # The release tag: the pushed tag, or the one typed into "Run workflow".
  # Empty for an ordinary build.
  RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            python: "3.14"
          - os: ubuntu-22.04        # oldest supported glibc = widest reach
            platform: linux-x64
            python: "3.14"
          # 3.13 on macOS: README 1.2 - Tcl/Tk 9 breaks drag & drop and parts
          # of the Synth window, and the macOS builds are where 9 shows up.
          - os: macos-latest
            platform: macos-arm64
            python: "3.13"
          - os: macos-15-intel
            platform: macos-x64
            python: "3.13"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # All history and tags, for git describe below.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Stamp the version from the tag
        id: meta
        run: |
          script=PyP6-Roland-P6-Sample-Manager.py
          if [[ -n "$RELEASE_TAG" ]]; then
            # v4.2.4 is a release; v4.2.4-rc1 / v4.2.4-test1 a pre-release.
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tag must look like v4.2.4 or v4.2.4-rc1, not $RELEASE_TAG"
              exit 1
            fi
            version="${RELEASE_TAG#v}"
          else
            # An ordinary build is named after the nearest release tag:
            # v5.2.1-3-gabc1234 is three commits after v5.2.1.
            described=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || true)
            if [[ -n "$described" ]]; then
              version="${described#v}"
            else
              version="0.0.0-dev-${GITHUB_SHA::7}"
            fi
          fi
          # The script in git carries APP_VERSION = None; the copy that is
          # frozen gets the real version.
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"$version\"/" "$script"
          if ! grep -qx "APP_VERSION = \"$version\"" "$script"; then
            echo "::error::Could not stamp APP_VERSION into $script"
            exit 1
          fi
          echo "script=$script" >> "$GITHUB_OUTPUT"
          echo "label=v$version" >> "$GITHUB_OUTPUT"
          echo "Building $script, version $version"

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tk8.6 libportaudio2 xvfb

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy soundfile sounddevice pydub tkinterdnd2 audioop-lts pillow

      - name: Check Tcl/Tk version
        run: |
          tk=$(python -c "import tkinter; print(tkinter.Tcl().eval('info patchlevel'))")
          echo "Tcl/Tk $tk"
          if [[ "$tk" == 9.* ]]; then
            echo "::warning::Built against Tcl/Tk $tk - drag & drop will not work in this build (README 1.2)."
          fi

      # Windows and Linux use the "shared" builds: ffmpeg and ffprobe then
      # share one copy of the codec libraries instead of each carrying its
      # own - the static builds made the download about half again as big.
      # Everything is flattened into ffbin/, the same flat layout the files
      # get inside the bundle, and run from there as a check.
      - name: Fetch ffmpeg and ffprobe
        run: |
          mkdir -p ffbin ffdl
          case "${{ matrix.platform }}" in
            windows-x64)
              curl -fsSL -o ffdl/ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip
              7z x -offdl ffdl/ff.zip > /dev/null
              cp ffdl/*/bin/ffmpeg.exe ffdl/*/bin/ffprobe.exe ffdl/*/bin/*.dll ffbin/ ;;
            linux-x64)
              curl -fsSL -o ffdl/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl-shared.tar.xz
              tar -xJf ffdl/ff.tar.xz -C ffdl
              cp ffdl/*/bin/ffmpeg ffdl/*/bin/ffprobe ffbin/
              # Only the soname (libavcodec.so.63), which is what the
              # binaries ask for - the fully versioned file next to it is the
              # same library, and copying both bundled every one twice.
              # -L: the soname is a symlink; the bundle needs the real file.
              for lib in ffdl/*/lib/*.so.*; do
                if [[ "$lib" =~ \.so\.[0-9]+$ ]]; then cp -L "$lib" ffbin/; fi
              done
              # Mirrors the frozen app, where the libraries sit next to the
              # binaries and PyInstaller's bootloader puts that folder on
              # LD_LIBRARY_PATH for child processes.
              export LD_LIBRARY_PATH="$PWD/ffbin" ;;
            macos-arm64|macos-x64)
              arch=$([[ "${{ matrix.platform }}" == macos-arm64 ]] && echo arm64 || echo amd64)
              for tool in ffmpeg ffprobe; do
                curl -fsSL -o "ffdl/$tool.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/$arch/release/$tool.zip"
                unzip -o -q "ffdl/$tool.zip" -d ffbin
              done ;;
          esac
          chmod +x ffbin/* || true
          ls -la ffbin
          du -sh ffbin
          ./ffbin/ffmpeg -hide_banner -version | head -n 1
          ./ffbin/ffprobe -hide_banner -version | head -n 1

      - name: Build with PyInstaller
        run: |
          case "${{ matrix.platform }}" in
            windows-x64)
              ff=(--add-binary "ffbin/ffmpeg.exe;."
                  --add-binary "ffbin/ffprobe.exe;."
                  --add-binary "ffbin/*.dll;.")
              mode=(--onefile) ;;
            linux-x64)
              ff=(--add-binary "ffbin/ffmpeg:."
                  --add-binary "ffbin/ffprobe:."
                  --add-binary "ffbin/*.so.*:.")
              mode=(--onefile) ;;
            macos-*)
              ff=(--add-binary "ffbin/ffmpeg:."
                  --add-binary "ffbin/ffprobe:.")
              # A .app has to be a folder bundle; one-file .apps are
              # deprecated in PyInstaller and start slowly.
              mode=(--onedir --osx-bundle-identifier io.github.pyp6.samplemanager) ;;
          esac

          # First a throwaway probe frozen with the same ffmpeg files: it
          # runs ffmpeg and ffprobe from inside a real bundle, which is the
          # only place a missing shared library would show up.
          cat > ffcheck.py <<'EOF'
          import os, subprocess, sys
          for tool in ("ffmpeg", "ffprobe"):
              exe = os.path.join(sys._MEIPASS, tool + (".exe" if os.name == "nt" else ""))
              out = subprocess.run([exe, "-hide_banner", "-version"],
                                   capture_output=True, text=True, check=True)
              print(out.stdout.splitlines()[0])
          EOF
          python -m PyInstaller --onefile --name ffcheck -y --distpath ffcheck-dist \
            --workpath ffcheck-build "${ff[@]}" ffcheck.py > ffcheck-build.log 2>&1 \
            || { cat ffcheck-build.log; exit 1; }
          ./ffcheck-dist/ffcheck

          python -m PyInstaller --name PyP6 -y --clean --windowed \
            --icon pyp6logo.ico --collect-data tkinterdnd2 \
            "${mode[@]}" "${ff[@]}" "${{ steps.meta.outputs.script }}"
          ls -la dist

      - name: Smoke test (the app must still be running after 30 s)
        run: |
          case "${{ matrix.platform }}" in
            windows-x64) exe=dist/PyP6.exe ;;
            linux-x64)   exe=dist/PyP6 ;;
            macos-*)     exe=dist/PyP6.app/Contents/MacOS/PyP6 ;;
          esac
          if [[ "${{ matrix.platform }}" == linux-x64 ]]; then
            xvfb-run -a "$exe" > smoke.log 2>&1 &
          else
            "$exe" > smoke.log 2>&1 &
          fi
          pid=$!
          sleep 30
          if kill -0 "$pid" 2>/dev/null; then
            echo "Still running after 30 s - OK"
            kill "$pid" 2>/dev/null || true
            [[ "$RUNNER_OS" == Windows ]] && taskkill //F //IM PyP6.exe > /dev/null 2>&1 || true
            [[ "$RUNNER_OS" == Linux ]] && pkill -f dist/PyP6 || true
          else
            echo "::error::The app exited during startup"
            cat smoke.log
            exit 1
          fi

      - name: Package
        id: pkg
        run: |
          name="PyP6-${{ steps.meta.outputs.label }}-${{ matrix.platform }}"
          mkdir -p "stage/$name" out
          cp README.md "stage/$name/"
          case "${{ matrix.platform }}" in
            windows-x64)
              cp dist/PyP6.exe "stage/$name/"
              (cd stage && 7z a -tzip -mx=9 "../out/$name.zip" "$name" > /dev/null) ;;
            linux-x64)
              cp dist/PyP6 "stage/$name/"
              chmod +x "stage/$name/PyP6"
              tar -czf "out/$name.tar.gz" -C stage "$name" ;;
            macos-*)
              cp -R dist/PyP6.app "stage/$name/"
              # ditto keeps the bundle's symlinks and signatures intact,
              # which a plain zip does not.
              ditto -c -k --keepParent "stage/$name" "out/$name.zip" ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/*
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: build
    # Same condition as RELEASE_TAG being set (a job-level if cannot read env).
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag's message is the release description. actions/checkout
      # turns a pushed annotated tag into a plain one, so it is fetched
      # again here; a tag that does not exist yet (Run workflow) is skipped.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes
      - name: Fetch the tag with its message
        run: |
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>/dev/null \
            || echo "Tag $RELEASE_TAG is not on GitHub yet - it is created with the release"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Where the description comes from, first match wins:
          # 1. the message of an annotated tag (git tag -a),
          # 2. .github/release-notes/<tag>.md, for a release started with
          #    Run workflow, where there is no tag to write a message on,
          # 3. GitHub's list of the pull requests merged since the last release.
          # Every release then gets the same download table, named from the tag.
          ref="refs/tags/$RELEASE_TAG"
          if [[ "$(git cat-file -t "$ref" 2>/dev/null)" == tag ]]; then
            echo "Notes from the message of tag $RELEASE_TAG"
            message=$(git for-each-ref --format='%(contents)' "$ref")
            signature=$(git for-each-ref --format='%(contents:signature)' "$ref")
            printf '%s\n' "${message%"$signature"}" > notes.md
          elif [[ -f ".github/release-notes/$RELEASE_TAG.md" ]]; then
            echo "Notes from .github/release-notes/$RELEASE_TAG.md"
            cp ".github/release-notes/$RELEASE_TAG.md" notes.md
          else
            echo "Notes generated from the merged pull requests"
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" \
              --jq .body > notes.md
          fi
          # Older notes files carry their own table.
          if ! grep -q '^## Downloads' notes.md; then
            cat >> notes.md <<EOF

          ## Downloads

          | Download | For |
          |---|---|
          | \`PyP6-$RELEASE_TAG-windows-x64.zip\` | Windows 10/11, 64-bit |
          | \`PyP6-$RELEASE_TAG-macos-arm64.zip\` | Macs with Apple Silicon (M1 and later) |
          | \`PyP6-$RELEASE_TAG-macos-x64.zip\` | Intel Macs |
          | \`PyP6-$RELEASE_TAG-linux-x64.tar.gz\` | 64-bit Linux |

          **First launch:**
          - **Windows:** SmartScreen may warn about an unsigned app. Choose "Run anyway".
          - **macOS:** the app is not signed with an Apple certificate. Right-click it, choose **Open**, then **Open** again (on macOS 15 and later, allow it under System Settings → Privacy & Security).
          - **Linux:** audio playback needs PortAudio from your distribution, e.g. \`sudo apt install libportaudio2\`.
          EOF
          fi
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          # A tag with a suffix (v4.2.4-rc1) is published as a pre-release:
          # it never becomes "Latest", so the README's download link keeps
          # pointing at the last real release.
          extra=()
          if [[ "$RELEASE_TAG" == *-* ]]; then extra=(--prerelease); fi
          # --target: for a run started from the Actions tab the tag does
          # not exist yet and is created on the commit that was just built.
          # For a pushed tag it already exists and --target is ignored.
          gh release create "$RELEASE_TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PyP6 $RELEASE_TAG" \
            --notes-file notes.md \
            "${extra[@]}"
